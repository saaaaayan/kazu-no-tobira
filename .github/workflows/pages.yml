name: Publish 数のトビラ to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  explain-publish-gate:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      MAIN_BUILD: ${{ github.ref == 'refs/heads/main' }}
      ENTITLEMENTS_READY: ${{ vars.PRODUCTION_ENTITLEMENTS_READY == 'true' }}
    steps:
      - name: Record whether production deployment is eligible
        run: |
          if [[ "$MAIN_BUILD" != true ]]; then
            echo 'Production deployment skipped because the ref is outside main.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$ENTITLEMENTS_READY" != true ]]; then
            echo 'Production deployment skipped because PRODUCTION_ENTITLEMENTS_READY is unset or is not true.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Production entitlement condition passed. Content and build checks are still required.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build-and-deploy:
    # Keep the last production deployment until purchase verification and content delivery are ready.
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_ENTITLEMENTS_READY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm bank:quality-gate
      - name: Set GitHub Pages base path for this build
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('app.json','utf8'));p.expo.experiments={...p.expo.experiments,baseUrl:'/kazu-no-tobira'};fs.writeFileSync('app.json',JSON.stringify(p,null,2));"
      - name: Embed the source commit in the browser app
        run: |
          printf "export const BUILD_VERSION = '%s';\n" "$GITHUB_SHA" > src/buildVersion.ts
      - name: Build the DB-only production client
        env:
          EXPO_PUBLIC_KAZU_GAME_ORIGIN: ${{ vars.PRODUCTION_GAME_ORIGIN }}
        run: node scripts/export-db-preview.mjs web .expo/pages-release --production
      - name: Publish the version manifest for update checks
        run: |
          printf '{"version":"%s"}\n' "$GITHUB_SHA" > .expo/pages-release/version.json
      - run: touch .expo/pages-release/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .expo/pages-release
      - uses: actions/deploy-pages@v4
        id: deployment

  verify-production:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm the public site is serving the deployed commit
        env:
          SITE: https://saaaaayan.github.io/kazu-no-tobira/
        run: |
          for attempt in {1..18}; do
            if node scripts/verify-web-release.mjs "$SITE" "$GITHUB_SHA"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The public site did not serve ${GITHUB_SHA} within the verification window."
          exit 1
