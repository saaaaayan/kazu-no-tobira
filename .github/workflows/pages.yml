name: Publish 数のトビラ to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Set GitHub Pages base path for this build
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('app.json','utf8'));p.expo.experiments={...p.expo.experiments,baseUrl:'/kazu-no-tobira'};fs.writeFileSync('app.json',JSON.stringify(p,null,2));"
      - name: Embed the source commit in the browser app
        run: |
          printf "export const BUILD_VERSION = '%s';\n" "$GITHUB_SHA" > src/buildVersion.ts
      - run: pnpm build:web
      - name: Publish the version manifest for update checks
        run: |
          printf '{"version":"%s"}\n' "$GITHUB_SHA" > dist/version.json
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
