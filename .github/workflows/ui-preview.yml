name: Build sample-only UI preview
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/export-ui-preview.mjs .expo/ui-preview-web
      - name: Verify the build over HTTP
        run: |
          node scripts/serve-review.mjs .expo/ui-preview-web 8130 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..5}; do
            if node scripts/verify-web-release.mjs http://127.0.0.1:8130/ "$GITHUB_SHA" ui-preview; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview-${{ github.sha }}
          path: .expo/ui-preview-web
          if-no-files-found: error
