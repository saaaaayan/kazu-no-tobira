<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数のトビラ 問題品質監査</title>
<style>
body{margin:0;background:#f3f1f8;color:#273351;font:16px/1.55 system-ui,sans-serif}
main{max-width:1180px;margin:auto;padding:24px 16px}
h1{margin:0 0 .5rem}
section,.scroll{background:#fff;border:1px solid #d7dcec;border-radius:12px;padding:16px;margin:16px 0}
#metrics{display:flex;flex-wrap:wrap;gap:10px}
.metric{background:#edf0fd;padding:10px 14px;border-radius:8px}
a{color:#294b96}
.scroll{overflow:auto}
table{border-collapse:collapse;min-width:820px;width:100%;text-align:left}
th,td{padding:8px;border-bottom:1px solid #d7dcec;vertical-align:top}
th{background:#eef1f9;white-space:nowrap}
label{display:block;margin-bottom:8px}
input,select{font:inherit;padding:8px;margin-right:8px;max-width:100%;box-sizing:border-box}
</style>
<main>
<h1>数のトビラ 問題品質監査</h1>
<p>登録済みの問題と生成サンプルを分けています。品質合格数はレビュー記録から集計します。</p>
<section id="metrics" aria-label="監査集計"></section>
<section>
<label for="search">ステージID・学年・単元・技能で絞り込み</label>
<input id="search" type="search" placeholder="例 e5.s、図形、sage">
<label for="source">出題元</label>
<select id="source"><option value="">すべて</option><option value="bank">登録済み</option><option value="fallback">生成</option><option value="unavailable">未出題</option></select>
<p><a href="stages.tsv" download>全ステージのTSV</a> ／ <a href="summary.json">集計JSON</a> ／ <a href="findings.jsonl" download>重複候補などの詳細JSONL</a></p>
<p id="matches" role="status"></p>
<div class="scroll">
<table>
<thead><tr><th>ステージ</th><th>学年</th><th>単元</th><th>登録</th><th>サンプル</th><th>図あり</th><th>一致候補</th><th>品質状況</th><th>代表問題</th></tr></thead>
<tbody id="results"></tbody>
</table>
</div>
</section>
</main>
<script>
const metricPanel=document.getElementById('metrics');
const search=document.getElementById('search');
const source=document.getElementById('source');
const matches=document.getElementById('matches');
const results=document.getElementById('results');
const number=new Intl.NumberFormat('ja-JP');
async function load(url,type) {
 const response=await fetch(url);
 if(!response.ok) throw new Error('Read failed: '+url);
 return response[type]();
}
Promise.all([load('summary.json','json'),load('stages.tsv','text')]).then(([report,text])=>{
 for(const [label,value] of [['ステージ',report.stages],['目標問題数',report.target],['登録問題',report.registered],
   ['生成サンプル',report.fallback.questions],['品質合格',report.reviews.approvedIndependent],
   ['小5・小6の隠しで一致',report.duplicates.e5e6SecretExact]]) {
   const tile=document.createElement('div');
   tile.className='metric';
   tile.textContent=label+' '+number.format(value);
   metricPanel.append(tile);
 }
 const [header,...sourceRows]=text.trimEnd().split('\n').map(row=>row.split('\t'));
 const columns=['ステージID','学年・島','単元','登録数','サンプル数','図あり','一致グループ','品質状況','代表問題'].map(name=>header.indexOf(name));
 const bySource=header.indexOf('出題元');
 function refresh() {
   const query=search.value.trim().normalize('NFKC').toLowerCase();
   const rows=sourceRows.filter(row=>(!source.value || row[bySource]===source.value) &&
     (!query || [row[0],row[1],row[3],row[4]].join(' ').normalize('NFKC').toLowerCase().includes(query)));
   matches.textContent=number.format(rows.length)+'件'+(rows.length>120?'（先頭120件を表示）':'');
   results.replaceChildren(...rows.slice(0,120).map(row=>{
     const tr=document.createElement('tr');
     for(const index of columns) tr.insertCell().textContent=row[index];
     return tr;
   }));
 }
 search.addEventListener('input',refresh);
 source.addEventListener('change',refresh);
 refresh();
}).catch(()=>{matches.textContent='監査データを読み込めませんでした。';});
</script>
</html>
